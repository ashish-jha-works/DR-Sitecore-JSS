              items:
                - fields:
                    Question: 'What are the standard payment terms?'
                    Answer: >-
                      <ul>
                        <li>The standard payment terms for the rental amount shall be 1 to 6 equal instalments spread over the tenure of the Tenancy Agreement.</li>
                        <li>The first instalment can be of higher value than the remaining.</li>
                      </ul>

                - fields:
                    Question: 'What cheques must be submitted to issue the Tenancy Agreement?'
                    Answer: >-
                      <p>Rent cheques, Security Deposit (refundable – equivalent to 5% of the annual rent amount), Ejari fee (administration and processing fee) and Housing fee (units that do not have DEWA-sub meter). If payment made by mode of Direct debit*/RC, security cheque for rental amount must be provided by the tenant.</p>
                      <p>* Former Nakheel tenants, please be informed that the direct debit payment option is no longer available. Kindly use alternative payment methods such as post-dated cheques, bank transfers, or credit/debit card payments.</p>

                - fields:
                    Question: 'How do I schedule/reschedule the date of my viewing visit?'
                    Answer: >-
                      Please contact our Call Centre on <a href="tel:800 9933"><u>800 9933</u></a>. Visit Community center and meet with leasing staff.

                - fields:
                    Question: 'How much is the security deposit?'
                    Answer: The security deposit is equivalent to 5% of the annual rent.

                - fields:
                    Question: 'How much is the Ejari registration fee?'
                    Answer: 'Ejari registration fee is D 214.50 including VAT.'

                - fields:
                    Question: 'Is rental commission different for Dubai Residential and Brokers?'
                    Answer: Commission is 5% of the annual rent is applied. However, for some projects the commission has been waived as part of a promotion. Nevertheless other Brokers commissions will still be applicable.

                - fields:
                    Question: 'Can I authorize someone to sign the contract on my behalf?'
                    Answer: With attested and valid power of attorney clearly stating the authorization to sign residential leases we can accept someone to sign the contract on your behalf.

                - fields:
                    Question: 'What time can I do a viewing on a unit?'
                    Answer: Our community site offices are open from Monday to Friday between 8am-6pm. We advise you to come no later than 5 pm if you wish to view a unit.

                - fields:
                    Question: 'Do I require a valid residency visa to rent a unit?'
                    Answer: >-
                      RERA requirements make it mandatory to possess a valid Emirates ID in order to receive an Ejari Certificate.
                      <br /><br />
                      To rent a unit without a valid residency visa you must submit a copy of the Emirates ID application, a letter confirming that you are employed, and send a copy of your work permit directly to us for consideration.

                - fields:
                    Question: 'Can I rent more than one unit at the same time?'
                    Answer: Individual residents can rent only 1 unit at a time. All exceptions to this rule must be subject to review and approval from the management. Corporates with a valid UAE Business License Government Decree may lease multiple units. A single Tenancy Agreement is issued, provided the units are in the same building or block of units.

                - fields:
                    Question: 'Can a third party make a payment on my behalf?'
                    Answer: 'Yes. Kindly prepare a third party NOC signed by you and the third party providing the cheque. The third party can then submit the NOC to us, along with a valid Residency visa, Passport copy and Emirates ID. Third party payments are subject to review and approval.'

                - fields:
                    Question: 'Can I align rental payments with my salary?'
                    Answer: Yes. A request needs to be made during the preparation of the tenancy contract, this request will be subject to approval. Please note that once installment dates are set, we are unable to amend those dates until the time comes to renew your contract.

                - fields:
                    Question: 'Can I make cash payments?'
                    Answer: >-
                      Yes. Please visit a cashier at the onsite community teller. Cash payment is accepted if rent is settled in full, as the first rental installment with the remainder of installments by post dated cheque. If you would like to exchange a post dated cheque for cash payment, then D 100 plus VAT will be charged per cheque. Please note that no cash payment above 55,000 D will be accepted.

                - fields:
                    Question: 'Can I pay by credit card or cheque?'
                    Answer: 'Yes, we accept both forms of payment.'

                - fields:
                    Question: 'Do I pay a fee to book a unit?'
                    Answer: No. There is no fee for booking a unit, and the booked unit is held for a maximum of 24 hours. Only our affiliated external agents and Dubai Residential agents can book units to secure the property while the contract is issued.

                - fields:
                    Question: 'What if a cheque bounces?'
                    Answer: >-
                      <p>Please make a collection request through call center to recall cheques. Once ready, please collect the bounced cheque(s) from a cashier at your community Leasing Office, and pay the dues. A bounced cheque attracts a penalty of D 1000. VAT may Apply.</p>
                      <p>A late payment fee is also charged for each day of delay starting from the actual due date on the cheque, calculated on a pro rata daily basis for each day under the contract that is not paid.</p>

                - fields:
                    Question: 'Can I defer a rent payment?'
                    Answer: >-
                      Deferring a payment is subject to the approval of Dubai Residential. Please submit your request no less than 14 working days before the payment is due. If your request is approved, an amount of D 250 + VAT per payment shall be applicable. Payment deferral fees shall not be applicable if the tenant is requesting for deferral during the time of renewal of the contract. Send us an email attaching supporting documents and a valid reason for deferring your payment.

                - fields:
                    Question: 'What is the cheque replacement fee?'
                    Answer: >-
                      Request to replace post-dated cheques is considered only if made no less than 14 working days prior to the payment due date.
                      <br /><br />
                      A fee of D 250 plus VAT each is applicable for replacing post-dated cheques.

                - fields:
                    Question: 'Does a bounced cheque from me invite legal action?'
                    Answer: When a cheque bounces, our legal team is notified and will investigate. They then commence further action if payment and associated fees are not settled within the communicated time frame.

