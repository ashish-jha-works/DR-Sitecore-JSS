              items:
                - fields:
                    Question: 'I have noticed faults in common areas of the community. Where do I report these?'
                    Answer: If you notice faults in common areas of the community please share the details with us by raising maintenance request through the Dubai Residential APP or calling the call center on 800 9933.

                - fields:
                    Question: 'How do I file a complaint against my neighbor?'
                    Answer: Please file your complaint through the Dubai Residential APP or Call Centre on 800 9933 or the Property Management Office until 5:00 pm, after which time you will need to contact the police.

                - fields:
                    Question: 'Who is responsible for pruning trees in common areas of the community and in my property?'
                    Answer: Pruning trees in common areas is the responsibility of the Property Management team. Pruning trees within your own garden is your responsibility.

                - fields:
                    Question: 'May I trim trees and shrubs around my property?'
                    Answer: Trees and shrubs planted in the community's common areas are under the jurisdiction of the Property Management and are maintained by the appointed landscaping team. No alteration to the common area will be permitted.

                - fields:
                    Question: 'May I change trees and shrubs planted in common areas of the community?'
                    Answer: Trees and shrubs planted in common areas belong to the Property Management, and individual tenants are not permitted to make changes in order to protect the overall design and aesthetics of the community.

