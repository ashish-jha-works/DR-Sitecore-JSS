              items:
                - fields:
                    Question: 'What is the Move-In process?'
                    Answer: >-
                      <p>As soon as lease is signed download the Dubai Residential APP to commence the move in process for residential units. For staff accommodation, please visit the Property Management and provide below mentioned documents.</p>
                      <p>Upload the necessary utilities registration and schedule your move in appointment. You will be contacted to confirm the appointment with our Property Management Executive.</p>
                      <p>Required documentation:</p>
                      <p>· Copy of DEWA, Empower connection documentation and gas connection, if applicable.</p>
                      <p>· A valid UAE ID of the person whose name is under the Tenancy Agreement.</p>

                - fields:
                    Question: "I haven't completed my utility registration; can I still move into my unit?"
                    Answer: Utility registration is a mandatory requirement and must be completed before you move into your unit. This process is not applicable for the Staff Accommodation Projects.

                - fields:
                    Question: 'Does someone ensure my unit is in good condition before I move-in?'
                    Answer: >-
                      <p>Yes, your unit will be in good condition for your move-in appointment. All units are reinstated as per Dubai Residential standards and will be handed over to you in 'as-is' condition.</p>
                      <p>If you face issues with your unit after moving in, please contact call us at 800 9933 or raise a service request through the Dubai Residential APP.</p>

                - fields:
                    Question: 'I am unable to attend the move-in appointment. Can I send someone on my behalf?'
                    Answer: If you are unable to attend this appointment, please appoint an authorised person to attend on your behalf. Make sure you provide us with Power of Attorney / authorisation or email/letter sent from the registered email, as per the contract.

                - fields:
                    Question: 'What if I am unhappy with the condition of my unit the day I move in?'
                    Answer: In the unlikely event that you are not willing to accept your unit in the condition it is in, the Property Management Executive will address your concerns and investigate further.

