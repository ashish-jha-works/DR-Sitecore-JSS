              items:
                - fields:
                    Question: 'Is extra storage space available to me?'
                    Answer: Rental storage space varies per community. For more information please send an email to customercare@dubairesidential.ae or speak to the Call Centre on 800 9933.

                - fields:
                    Question: 'May I post on the notice boards in common areas?'
                    Answer: Notice boards are solely for the use of the Property Management team.

                - fields:
                    Question: 'What is the purpose of the annual survey for tenants?'
                    Answer: Your feedback is important to us. Annual surveys are conducted to help us know our tenants better, and to get insightful feedback on how to improve the living standards within the community. The surveys are anonymous.

                - fields:
                    Question: 'May I host a private party or event in a common area?'
                    Answer: Yes. Please book the common area at least one week before the event by raising a request through the Dubai Residential APP, by visiting your community's Property Management Office, or by emailing customercare@dubairesidential.ae. We do not permit exclusive reservation of a common area for private events.

                - fields:
                    Question: 'May I use the community pool area for a private party or event?'
                    Answer: As a health and safety precaution, and to avoid inconvenience to other tenants, we do not permit the use of swimming pools as venues for private events.

                - fields:
                    Question: 'What are the consequences of the violation notice I received?'
                    Answer: Receiving this letter means you violated a term of your Tenancy Agreement, or a clause in the community rules and regulations. Please comply with the request in the notice, and rectify the situation as soon as possible. If not, legal action could be taken or a fine will be imposed.

                - fields:
                    Question: 'What is the fee for a new access card/ Parking Tag?'
                    Answer: D 200 plus VAT per card in the case that card is lost. Any additional cards can be purchased based on the relevant policy.

                - fields:
                    Question: 'May I sublet my unit or a part of it to another person?'
                    Answer: Subleasing your property or a part of it to any person is not permitted, and is against the rules and regulations of RERA. Doing so invites legal action and eviction from your unit.

                - fields:
                    Question: 'Are pets allowed?'
                    Answer: Our communities are pet friendly, and we welcome pets within apartments as long as they are allowed by Dubai Municipality, have been chipped (for cats and dogs), do not create noise or disturbance to other tenants, and are kept on a leash at all times when in common areas.

                - fields:
                    Question: 'Why is an Empower meter installed in my unit?'
                    Answer: Empower meters are installed to create a direct relationship between you and your utility provider, and allow you control over consumption of RT (Refrigeration Tonnes). Billing is in proportion to BTU meter consumption and charged monthly.

                - fields:
                    Question: 'What are the Empower charges?'
                    Answer: Charges include Monthly Consumption and Maintenance.

                - fields:
                    Question: 'May I book the amenities (football, paddle, tennis courts, etc)?'
                    Answer: Where applicable, you may book certain amenities through the Dubai Residential APP if terms of use are strictly followed.
