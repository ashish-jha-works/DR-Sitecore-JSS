              items:
                - fields:
                    Question: 'What documents do I need to submit to move out of my unit?'
                    Answer: >-
                      <p>Move out should be initiated through the Dubai Residential APP for any residential unit. For staff accommodation, please visit the Property Management, settle any outstanding and provide the below mentioned documents.</p>
                      <ol>
                        <li>Final utility bills (DEWA/ Empower)/ Request letter to DEWA/ Empower for final bills.</li>
                        <li>Your bank details for a bank transfer of the refund.</li>
                        <li>Tenant authorization letter (if you are unable to attend this meeting).</li>
                      </ol>

                - fields:
                    Question: 'What is the Move-Out process?'
                    Answer: >-
                      The move-out meeting involves a joint inspection of the property with an inspector, handing over access cards, and completing the inspection in order to refund the security deposit.
                      <br /><br />
                      The unit must be returned in the same condition it was received.

                - fields:
                    Question: 'Do I need to get a Move-Out Permit?'
                    Answer: >-
                      Yes. Tenants should carry out the move out process through the Dubai Residential APP or contact 800 9933 for any clarification. Appointments scheduled for move out will be between 8:00 AM-4:30 PM.
                      <br /><br />
                      The Move-Out Permit is obligatory and must be submitted to the Community Security Office before moving out your furniture and belongings.

                - fields:
                    Question: 'What if my Tenancy Agreement expires on a public holiday or weekend?'
                    Answer: >-
                      <p>If your Tenancy Agreement expires on a public holiday or weekend, you may vacate the unit on the next working day.</p>
                      <p>You will not be charged an overstay penalty fee.</p>

                - fields:
                    Question: "What if I can't attend the move-out meeting?"
                    Answer: A tenant can nominate a third party to carry out the inspection. Alternatively, please submit a letter to the Property Management Team and handover your access cards to security.

                - fields:
                    Question: 'When is the security deposit refunded to me?'
                    Answer: The security deposit is refunded to you 30 working days from the day you submit your last utility bills. The refund is directly transferred to your bank account, and you will receive a notification once it is credited. If the refund is less than 5,000 D then it will be refunded in cash.

                - fields:
                    Question: 'Can a third party receive my security deposit refund?'
                    Answer: Yes by providing a 3rd party NOC and subject to review and approval.

          - fields:
              tagName: In your Home
              tagIcon:
                src: /-/media/E093926137AA40E19C1AC10E5181807A.png
                alt: ''
                width: '75'
                height: '75'
              faqIcon: >-
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
