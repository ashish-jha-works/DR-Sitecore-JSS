              items:
                - fields:
                    Question: 'What does the maintenance cover?'
                    Answer: Facilities management is available 24/7 to assist you with issues related to mechanical, electrical and plumbing in your unit. Emergency maintenance during the night is available; however, appointment for regular services are scheduled during the day.

                - fields:
                    Question: 'Where do I log a maintenance service request?'
                    Answer: >-
                      <p>Please log all service requests on the Dubai Residential app, which can be downloaded on the iTunes and Google Play stores. If you have further requests, please contact the Call Centre at <a href="tel:800 9933">800 9933</a>, send an email to customercare@dubairesidential.ae.</p>

                - fields:
                    Question: 'How often is my unit repainted?'
                    Answer: Upon request, your unit could be repainted internally every 3 years. Repainting requests are scheduled on a first come, first served basis subject to availability.

                - fields:
                    Question: 'I would like to carry out alterations to my unit. Does this require any formal approvals?'
                    Answer: Approvals depend on the kind of alterations you seek. Please contact us at 800 9933 or send an email to customercare@dubairesidential.ae detailing the alterations to undertake.

                - fields:
                    Question: 'Why do I need to give access for maintenance?'
                    Answer: >-
                      <p>It is important to allow maintenance access to your property every 3 months to service the AC system, fire alarms and safety equipment.</p>
                      <p>This helps maintain the quality of these assets and ensures their proper functioning.</p>

                - fields:
                    Question: 'What happens if I refuse to give access?'
                    Answer: If you are unable to give access at the time of visit, please speak to the Call Centre on 800 9933 to schedule a visit at your convenience. Failure to provide access to your unit for one full quarter is a violation of the terms of the Tenancy Agreement.

                - fields:
                    Question: 'May I install a satellite dish for my property?'
                    Answer: >-
                      <p>We have installed a common satellite dish for apartment buildings and subscription is paid to the supplier depending on the number of sockets you use.</p>
                      <p>Satellite dishes are allowed in villas as long as they are installed on the roof and not on a balcony, and are not evident in plain sight.</p>

                - fields:
                    Question: 'May I plant Damas trees in my garden?'
                    Answer: It is against Dubai Municipality Regulations to plant Damas trees and therefore not allowed within our communities.

                - fields:
                    Question: 'How do I change my unit?'
                    Answer: >-
                      <p>Please raise a request through the Dubai Residential APP or contact the call center at 8009933. A leasing agent shall contact you and check the availability of other units. In order to change your unit, we issue a new Tenancy Agreement, and ask for a new security deposit and a transfer fee of D 1,000 plus VAT.</p>

