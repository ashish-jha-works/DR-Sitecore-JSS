              items:
                - fields:
                    Question: 'What is the process to renew my lease?'
                    Answer: >-
                      <ol>
                        <li>90 days prior to the expiration of your Tenancy Contract you will receive a renewal notice on your registered email along with the instructions on how to renew.</li>
                        <li>You may commence the renewal process through the Dubai Residential APP.</li>
                        <li>Once you have compiled all your documents, you contact us via Dubai Residential APP to schedule a pickup. You may contact us at 800-9933 for any further clarification.</li>
                        <li>The Operations team will review your documentation and process your new Tenancy Agreement.</li>
                        <li>A copy of your Tenancy Agreement, Ejari agreement and payment receipts will be sent to you via courier.</li>
                      </ol>

                - fields:
                    Question: 'How do I calculate my annual renewal rent?'
                    Answer: >-
                      To determine the exact amount, visit the RERA calculator online at:
                      <a href="https://www.dubailand.gov.ae/English/Pages/Rental-Increase-calculator.aspx"><u>https://www.dubailand.gov.ae/English/Pages/Rental-Increase-calculator.aspx</u></a>

                - fields:
                    Question: 'What if I wish to terminate my lease?'
                    Answer: >-
                      If you do not wish to renew your lease, you must provide written notice of non-renewal 2 months for individual and 3 months for corporate tenant prior to the expiry date. Failure to do so will incur in a penalty of 2 months for individual and 3 months for corporate tenant of rent. Notice can be sent via email at <a href="mailto:customercare@dubairesidential.ae"><u>customercare@dubairesidential.ae</u></a>. Tenant can also initiate move out on the Dubai Residential APP.

                - fields:
                    Question: 'Does terminating my Tenancy Contract involve a penalty?'
                    Answer: If you terminate your contract more than 60 days prior to its expiration, a penalty of 2 months of rent is applicable. If you terminate your Tenancy Agreement within the last 2 months of its expiration, no refund of the rent is applicable. For corporate tenants, an early termination penalty of 3 months shall apply.

                - fields:
                    Question: 'What if I fail to complete the termination process and vacate my unit after the expiration of my Tenancy Agreement?'
                    Answer: >-
                      <p>You are charged for DEWA, Empower and a penalty fee; which is calculated according to the amount of days you overstay as per the applicable renewal rent amount.</p>
                      <p>Legal charges may be applicable pending the circumstances. D 50 per day holding over fee (in addition to the Rent) calculated on a pro rata daily basis for each day that the Tenant remains in the Premises after the Expiry Date.</p>

                - fields:
                    Question: 'When is the latest I can renew my Tenancy Contract?'
                    Answer: Please complete the Remote Renewal process prior to the expiry date on your Tenancy Contract. Failure to renew prior to expiry date shall incur a late renewal fee calculated at 50 D per day and a holding over fee calculated at 50 D per day (in addition to the Rent).

                - fields:
                    Question: 'Please explain the calculation for annual rent?'
                    Answer: We adhere to RERA standards and do not surprise you with random rent fluctuations. The RERA index is updated annually and our rental rates are adjusted accordingly.

                - fields:
                    Question: 'Can I renew my Tenancy Contract?'
                    Answer: Yes as long as all the required documents are submitted and you have no pending payments with Dubai Residential.

                - fields:
                    Question: 'Can I renew my Tenancy Agreement for less than one year?'
                    Answer: >-
                      Yes. You can renew your contract on a short term basis for a minimum of 1 month to a maximum of 6 months. The renewal rent, based on the RERA index, will be applied for each renewal along with a 10% of the renewal rent premium if the renewal period is less than 6 months and the following fees will be charged: 500 D plus VAT admin fees and 214.50 D including VAT Ejari administration and processing fee. Please visit the contact our call centre on <a href="tel:800 9933"><u>800 9933</u></a> to place your request.

                - fields:
                    Question: 'Can a third party pay my rent?'
                    Answer: >-
                      <p>If you are not the issuer of cheques, please submit an NOC for third party payment.</p>
                      <p>Please e-mail the enquiry to us at <a href="mailto:customercare@dubairesidential.ae">customercare@dubairesidential.ae</a> or call us at <a href="tel:800 9933">800 9933</a> for further assistance.</p>

                - fields:
                    Question: 'What are the modes of payment upon renewal?'
                    Answer: >-
                      <ul>
                        <li>Post dated cheques</li>
                        <li>Using credit, debit, bank transfer or cash payments depending on the amount (for one-time payment)</li>
                        <li>Using recurring credit/debit card. You will require to provide an undated guarantee cheque with the full contract rent amount</li>
                      </ul>

                - fields:
                    Question: 'Can I transfer the lease to a family member or to a business account?'
                    Answer: >-
                      <p>You may request to transfer the existing tenancy contract to a direct family member (parent, sibling, spouse) or business account. Eligibility for Transfer of Unit:</p>
                      <p>· An existing valid lease contract</p>
                      <p>· The tenant has a clear history and no outstanding amounts.</p>
                      <p>· Availability of final DEWA bill request.</p>
                      <p>· Minimum of 10 days from the next payment (cheque)</p>
                      <p>A transfer fee of 1050 D shall be applicable along with EJARI fees</p>

