<h2>Welcome to the Dubai Residential Residents Portal</h2>

        <p>The Dubai Residential Residents Portal at <a href="https://residents.dubairesidential.ae">https://residents.dubairesidential.ae</a> (the &ldquo;Dubai Residential Residents Portal&rdquo;) and the Dubai Residential App available on Android and from iOS stores (the &ldquo;Dubai Residential App&rdquo;) are owned and operated by Dubai Residential Assets LLC (&ldquo;Company&rdquo; &ldquo;we&rdquo;, &ldquo;us&rdquo;, &ldquo;our&rdquo; and includes our subsidiaries or other affiliates).</p>

        <p>These terms and conditions (&ldquo;Terms&rdquo;) set out the basis upon which you (&ldquo;users&rdquo;, &ldquo;you&rdquo;, &ldquo;your&rdquo;) can access and use the Dubai Residential Residents Portal and/or the Dubai Residential App, including any content, functionality and services offered on or through the Dubai Residential Residents Portal and/or the Dubai Residential App, including those services set out in further detail in Section 3 below (&ldquo;Services&rdquo;).</p>

        <p>If you have any questions about the Dubai Residential Residents Portal and/or the Dubai Residential App then - in most cases - you will be able to find the answer in these Terms. If you cannot find an answer to your query, then please feel free to contact us at the email address specified in the Contact section below.</p>

        <details id="1-terms" class="LegalContentPage__accordion open">

        <summary class="LegalContentPage__accordion-summary"><span>1. Terms</span>

        </summary>

        <div class="LegalContentPage__accordion-body">

        <p>1.1. By accessing the Dubai Residential Residents Portal and/or the Dubai Residential App, you agree to be bound by these Terms. If you do not agree with any of the Terms, your sole recourse is to stop using the Dubai Residential Residents Portal and/or the Dubai Residential App.</p>

        <p>1.2. The Company may amend these Terms at any time by posting an updated version of the Terms on the Dubai Residential Residents Portal and/or the Dubai Residential App. The Company encourages you to check the Dubai Residential Residents Portal and/or Dubai Residential App regularly for any amendments to the Terms. Your continued use of the Dubai Residential Residents Portal and/or Dubai Residential App will constitute your express consent to these terms.</p>

        <p>1.3. Nothing in these Terms affects your statutory rights, either as a consumer of services or otherwise.</p>

        </div>

        </details>

        <details id="2-privacy-policy" class="LegalContentPage__accordion">

        <summary class="LegalContentPage__accordion-summary"><span>2. Privacy policy</span>

        </summary>

        <div class="LegalContentPage__accordion-body">

        <p>2.1. The personal information you provide in the course of using the Dubai Residential Residents Portal and/or the Dubai Residential App will be used in accordance with our Privacy Policy, the terms of which are hereby incorporated into and form part of these Terms.</p>

        </div>

        </details>

        <details id="3-services" class="LegalContentPage__accordion">

        <summary class="LegalContentPage__accordion-summary"><span>3. Services</span>

        </summary>

        <div class="LegalContentPage__accordion-body">

        <p>3.1. The Services available on the Dubai Residential Residents Portal and/or the Dubai Residential App include those set out below and may be varied, added to, and/or removed by the Company as and when it sees fit. The Company may only be able to complete certain of the Services subject to you taking certain actions, such as uploading documents and/or making payments (see Section 7), and does not accept any liability to you or any other party for any failure by you to take the required actions or for any unavailability of the Services. <strong>In the event that a user makes a request which it subsequently cancels, the user may be liable to pay a fee to the Company in respect of such cancelled request.</strong> Non-exhaustive details of required actions are included under the specific Services set out below and further details are included on the relevant section of the Portal/App.</p>

        <p>3.2. Any customers with a payment default history, pending payments and/or dues or outstanding legal cases with any member of the Company&rsquo;s group may not have access to the Dubai Residential Residents Portal and/or the Dubai Residential App and/or some of its features and/or offers available to other customers on the Dubai Residential Residents Portal and/or the Dubai Residential App and the Company reserves the right to refuse access to the Dubai Residential Residents Portal and/or the Dubai Residential App and/or any of its features and/or offers to any such customers.</p>

        <p><strong>3.3. The Services</strong></p>

        <p><strong>3.3.1. User Registration/Update User Profile</strong> &ndash; see Section 4 (&ldquo;Your Details&rdquo;) below for further detail.</p>

        <p><strong>3.3.2. Initiate move-in process</strong></p>

        <p><strong>3.3.3. Raising and tracking maintenance requests (in-unit)</strong> &ndash; you can request in-unit maintenance via the Dubai Residential Residents Portal and/or the Dubai Residential App. You will be required to provide details of the location of the unit and the nature of the maintenance to be provided. Subject to sufficient information being provided, the Company will make arrangements with you to attend the unit to assess the maintenance request and to determine whether the user or the Company is responsible for the costs of undertaking the maintenance (if any).</p>

        <p><strong>3.3.4. Raising and tracking Community Care requests</strong> &ndash; you can raise maintenance requests and complaints relating to your community via the Dubai Residential Residents Portal and/or the Dubai Residential App. You will be required to provide details of the location of the Community and the nature of the maintenance to be provided or basis for the complaint (as relevant). Subject to sufficient information being provided, the Company will make arrangements with you to attend the Community to assess the maintenance request and/or complaint (as applicable) and to determine whether the user or the Company is responsible for the costs of undertaking the maintenance (if any).</p>

        <p><strong>3.3.5. Lease Renewal</strong> &ndash; you can renew your lease via the Dubai Residential Residents Portal and/or the Dubai Residential App.</p>

        <ol>

        <li><p>The lease renewal process will be as follows (subject to any amendments the Company may make in its absolute discretion):</p>

        <ul>

        <li>The proposal for the renewal lease will be agreed as between you and the Company (including rent details (taking into account any applicable increase/decrease as per the RERA calculator), any applicable discounts, number of installments, etc.).</li>

        <li>You will complete the details of the sample PDCs and/or provide details of your credit/debit card and/or set up a direct debit* (see Section 7).</li>

        <li>You will provide the information/follow the process set out in paragraph (b) below.</li>

        <li>Subject to your compliance with paragraph (b) below and approval of the lease renewal by the Company (at its discretion), you will receive the renewed lease and Ejari from the Company via email.</li>

        </ul>

        <p>* Former Nakheel tenants, please be informed that the direct debit payment option is no longer available. Kindly use alternative payment methods such as post-dated cheques, bank transfers, or credit/debit card payments.</p>

        </li>

        <li><p>The renewal of the lease will be subject to the following:</p>

        <ul>

        <li>You uploading via the Dubai Residential Residents Portal and/or the Dubai Residential App such documents as the Company requests in connection with the renewal.</li>

        <li>You validly signing the renewal lease via one of the following methods:</li>

        <li>Using your UAE Pass digital signature; OR</li>

        <li>You downloading, printing and signing two copies of the renewal lease and sending the original signed copies of the lease to the Company; OR</li>

        <li>The Company sending you copies of the renewal lease for you to sign and return to the Company.</li>

        <li>You making payment of the Company&rsquo;s administration fee.</li>

        <li>You paying any pending rental or other payments relating to the property are pending.</li>

        </ul>

        </li>

        </ol>

        <p><strong>3.3.6. Enquiries related to lease agreement or enquiries for rental</strong> &ndash; users may submit enquiries relating to their lease agreement or enquiries for rental via the Dubai Residential Residents Portal and/or the Dubai Residential App. The Company may request further information in respect of the relevant enquiry before responding to the user.</p>

        <p><strong>3.3.7. Update documents related to your tenancy</strong></p>

        <p><strong>3.3.8. Make general enquiries</strong></p>

        <p><strong>3.3.9. Receive updates on events and activities in your community</strong></p>

        <p><strong>3.3.10. Provide app feedback</strong></p>

        <p><strong>3.3.11. Initiate move-out process</strong></p>

        </div>

        </details>

        <details id="4-your-details" class="LegalContentPage__accordion">

        <summary class="LegalContentPage__accordion-summary"><span>4. Your details</span>

        </summary>

        <div class="LegalContentPage__accordion-body">

        <p>4.1. You will need to register with the Dubai Residential Residents Portal and/or the Dubai Residential App to use any Services. To register, you must be at least 21 years of age and you must provide true, accurate, complete and current information (including name, date of birth, email address, credit/debit card details, and other details) as requested during the account creation. The registration process will require users to authenticate their identity using an OTP sent to their email or mobile number registered with the Company. The registration process may be amended from time to time at the Company&rsquo;s discretion.</p>

        <p>4.2. By registering yourself on the Dubai Residential Residents Portal and/or the Dubai Residential App, you warrant that the details you provide to the Company are correct and complete and you agree that you will inform the Company immediately of any changes to those details (e.g. change of email or postal address). If you are registering on behalf of a business or any corporate body, you are confirming that you hold the appropriate authority to bind the business or corporate body on whose behalf you are registering. You can access and update your details (not all details will be editable) using the [&ldquo;My Profile&rdquo; area] of the Dubai Residential Residents Portal and/or the Dubai Residential App. You authorise us to use any information provided to us in registering to verify your information (including any updated information), to obtain credit reports about you from time to time while you are registered, and to obtain an initial credit authorization from your credit card issuer at time of registration, need be. You must be issued with a major credit/debit card that is accepted by the Company and you must register that card with us, and your application for registration must otherwise be acceptable to Company in its own absolute discretion.</p>

        <p>4.3. You are responsible for maintaining the confidentiality of your account username and password and for preventing unauthorized access to your profile. You agree to accept responsibility for all activities that occur under your account. Please take all necessary steps to ensure that the username and password is kept confidential and secure. Please inform the Company immediately if you have any reason to believe that your username and/or password has become known to anyone else, or are being, or are likely to be, used in an unauthorized manner.</p>

        <p>4.4. The Company reserves the right to refuse access to the Dubai Residential Residents Portal and/or the Dubai Residential App, terminate accounts, remove or edit content, or cancel orders at Company&rsquo;s discretion. If the Company cancels an order, it will be without charge to you.</p>

        </div>

        </details>

        <details id="5-agreement-to-deal-electronically-electronic-communications-and-notices" class="LegalContentPage__accordion">

        <summary class="LegalContentPage__accordion-summary"><span>5. Agreement to deal electronically electronic communications and notices</span>

        </summary>

        <div class="LegalContentPage__accordion-body">

        <p>5.1. All of your transactions with or through the Dubai Residential Residents Portal and/or the Dubai Residential App may, at our option, be conducted electronically from start to finish. If we decide to proceed non-electronically, those Services will still be governed by the remainder of these Terms unless you enter into different terms on a form provided by us. You agree to print or make an electronic copy of the Terms and any other contract or disclosure that we are required to provide to you.</p>

        <p>5.2. By clicking &ldquo;Submit&rdquo; on any step of a transaction within this Site, you agree to conduct such transaction by electronic means. You understand that by clicking the box titled &ldquo;I agree to the Terms &amp; Conditions,&rdquo; you are agreeing to conduct an electronic transaction and to use and receive communications through electronic means. You agree to enter the requested information electronically via the Internet, and to be notified regarding any transaction electronically through the email address you have provided. You understand that electronically signed documents have the same legal effect as hard copies with ink signatures.</p>

        <p>5.3. Except as otherwise provided in these Terms we will give you any notices regarding the Dubai Residential Residents Portal and/or the Dubai Residential App by posting them on the Dubai Residential Residents Portal and/or the Dubai Residential App. To fulfill our obligations to you under these Terms, we may wish to communicate with you by email and/or by posting notices on the Dubai Residential Residents Portal and/or the Dubai Residential App. You agree to receive communications from us electronically and that electronic communications will satisfy any legal requirement for communications which need to be in writing.</p>

        </div>

        </details>

        <details id="6-service-requests" class="LegalContentPage__accordion">

        <summary class="LegalContentPage__accordion-summary"><span>6. Service requests</span>

        </summary>

        <div class="LegalContentPage__accordion-body">

        <p>6.1. We have created a streamlined registration process for certain applications for Services (&ldquo;Requests&rdquo;). This is only available for Requests using the Dubai Residential Residents Portal and/or the Dubai Residential App.</p>

        <p>6.2. We can, at our discretion, accept Requests, subject to receiving all payments in full in connection with the relevant Request in accordance with Section 7. You authorise us to act, and acknowledge that we will rely on the information provided by you in Requests. We are not required to ask about, or confirm any Requests with you, but we may choose to do so, and we are not required to take additional steps to verify instructions made using your account username and password.</p>

        <p>6.3. We can decline to act on Requests where we consider we have a good reason to do so (for example, Requests are unclear or contradictory, or we suspect the Requests are unauthorised).</p>

        <p>6.4. We will not be liable for any loss or damage you incur if:</p>

        <ul>

        <li>we act on instructions that are unauthorised, forged or fraudulently given;</li>

        <li>we do not act on instructions we consider to be unclear, illegible or contradictory; or</li>

        <li>you do not comply with any relevant terms for giving instructions.</li>

        </ul>

        </div>

        </details>

        <details id="7-payments" class="LegalContentPage__accordion">

        <summary class="LegalContentPage__accordion-summary"><span>7. Payments</span>

        </summary>

        <div class="LegalContentPage__accordion-body">

        <p>7.1. The Dubai Residential Residents Portal and the Dubai Residential App may from time to time permit users to attend to various matters relating to payments, including the following (subject in each case to availability and to any changes the Company may in its absolute discretion make to the relevant services from time to time):</p>

        <ul>

        <li>View and clear their outstanding dues</li>

        <li>View their upcoming rent installment details</li>

        <li>Manage their card details (add/remove card, transfer recurring payment of rent installment from one card to another)</li>

        <li>View and download details of their payment history</li>

        <li>Get e-receipt of their payments completed in past</li>

        <li>Pay rent installment by any of the following payment methods during contract renewal:</li>

        <li>All installments by Post Dated Cheques (PDCs)</li>

        <li>All installments by credit/debit card (in which case payments of future installment will be automatically deducted from non-expiring card details provided)</li>

        <li>1st installment by credit/debit card and the remainder by PDCs</li>

        <li>1st installment by credit/debit card and the remainder by Direct Debit*</li>

        <li>Clear outstanding dues during Move-Out process</li>

        <li>Defer payment of upcoming rent installment by a maximum of 30 days (provided that the outstanding amount at the relevant time is zero)</li>

        <li>Get notification for status of deferment request raised</li>

        <li>* Former Nakheel tenants, please be informed that the direct debit payment option is no longer available. Kindly use alternative payment methods such as post-dated cheques, bank transfers, or credit/debit card payments.</li>

        </ul>

        <p>7.2. The Dubai Residential Residents Portal and the Dubai Residential App accept payments made online using Visa or MasterCard credit/debit card in AED (or any other agreed currency).</p>

        <p>7.3. If you make a payment via the Dubai Residential Residents Portal or the Dubai Residential App, the details you are asked to submit will be provided directly to our third-party payment provider via a secured connection (&ldquo;Payment Gateway&rdquo;).</p>

        <p>7.4. We reserve the right to cancel your transaction processing account at any time for any reason at which time we will return the payment amount entered into the Payment Gateway, in an appropriate and reasonable timeframe.</p>

        <p>7.5. We reserve the right to refuse processing any payment made by you via the Payment Gateway at any time for any reason.</p>

        <p>7.6. Once payments have been made by users via the Payment Gateway, any refunds to the user will be made at the Company&rsquo;s discretion and subject to the Company&rsquo;s terms and conditions.</p>

        <p>7.7. The Company has the right to use the user&rsquo;s security and/or guarantee cheques in case of any outstanding payments or rental defaults by the user.</p>

        <p>7.8. It is your responsibility to terminate any and all recurring payments on your account before relocating or moving. If you fail to terminate such payments, charges will continue to be assessed to your billing account during the period designated for recurring payments to take place.</p>

        <p>7.9. If you believe a transaction was made improperly, we in our sole discretion may void, issue a credit, or rescind any transaction made through the Payment Gateway prior to remittance of such payment to your payee. Payment disputes arising after payment has been settled to your payee are between you and payee alone. We may act as an intermediary if such actions can reasonably and efficiently handle said problem provided that we do not accept any responsibility to you or the payee for acting in such capacity.</p>

        <p>7.10. In the event that the Company transfers any amount of your payments to a third party, then the Company does not accept any liability for any monies once they have transferred to the third party and you may need to contact the third party directly to seek to recover any monies in the event they were paid incorrectly.</p>

        <p>7.11. If applicable, you agree to pay all Request fees billable immediately to the credit card identified in your Request for the purpose of application processing. This billing will occur at the time of the relevant transaction.</p>

        </div>

        </details>

        <details id="8-use-of-the-dubai-residential-residents-portal-and-or-the-dubai-residential-app" class="LegalContentPage__accordion">

        <summary class="LegalContentPage__accordion-summary"><span>8. Use of the Dubai Residential residents portal and/or the Dubai Residential app</span>

        </summary>

        <div class="LegalContentPage__accordion-body">

        <p>8.1. The Company tries to keep all information on the Dubai Residential Residents Portal and/or the Dubai Residential App up to date, but it may not be correct all of the time. You should independently check the information you use is correct and you use the Dubai Residential Residents Portal and/or the Dubai Residential App at your own risk. If you find any incorrect information, you can notify the Company by calling or emailing at the details specified in the Contact section below.</p>

        <p>8.2. You must not conduct or promote any illegal activities while using the Dubai Residential Residents Portal and/or the Dubai Residential App. This includes any activities that (in Company&rsquo;s opinion) breach copyright, infringe on privacy or infringe any third-party rights as well as activities that are defamatory to third persons. To do so may lead to prosecution.</p>

        <p>8.3. You must not use the Dubai Residential Residents Portal and/or the Dubai Residential App to generate unsolicited emails, spam or promotional materials to other Users. You must not do anything to cause damage to the Dubai Residential Residents Portal and/or the Dubai Residential App or other users of the Dubai Residential Residents Portal and/or the Dubai Residential App, including any technical damage to the other computers. You must not send any viruses or other material designed to adversely affect the operation of the Dubai Residential Residents Portal and/or the Dubai Residential App, affect any other users of the Dubai Residential Residents Portal and/or the Dubai Residential App or affect any equipment or any data in the Dubai Residential Residents Portal and/or the Dubai Residential App. You must not attempt to gain access to the Dubai Residential Residents Portal and/or the Dubai Residential App or the system that runs the Dubai Residential Residents Portal and/or the Dubai Residential App. You must not interfere with the security of the Dubai Residential Residents Portal and/or the Dubai Residential App, its services, system resources or network. You must not use the Dubai Residential Residents Portal and/or the Dubai Residential App in any manner that could damage, overburden or impair the Dubai Residential Residents Portal and/or the Dubai Residential App nor harvest or otherwise collect any information about the Users. You must not link to the Dubai Residential Residents Portal without seeking Company&rsquo;s prior written consent. You must not frame the Dubai Residential Residents Portal and/or the Dubai Residential App on another website without seeking the Company&rsquo;s prior written consent. You must not change, edit, add to or produce summaries of its content anywhere else.</p>

        <p>8.4. Please note that it is illegal to provide false information-name, phone number or fraudulently obtained information regarding the credit /debit card or without the consent of the cardholder. Any party engaged in illegal activities involving the use of the Dubai Residential Residents Portal and/or the Dubai Residential App may be subject to prosecution. The Company does not guarantee that the Company will be able to prevent any illegal or inappropriate use of the Dubai Residential Residents Portal and/or the Dubai Residential App, or will give notice of any illegal or inappropriate use of the Dubai Residential Residents Portal and/or the Dubai Residential App.</p>

        </div>

        </details>

        <details id="9-change-of-the-dubai-residential-residents-portal-and-cessation-of-operations" class="LegalContentPage__accordion">

        <summary class="LegalContentPage__accordion-summary"><span>9. Change of the Dubai Residential residents portal and cessation of operations</span>

        </summary>

        <div class="LegalContentPage__accordion-body">

