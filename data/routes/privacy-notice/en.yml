<details id="introduction" class="LegalContentPage__accordion open">

        <summary class="LegalContentPage__accordion-summary"><span>Introduction</span>

        </summary>

        <div class="LegalContentPage__accordion-body">

        <p>We are committed to protecting and respecting your privacy. This Privacy Notice (the &ldquo;Notice&rdquo;) governs the collection and use of personal data by Dubai Residential LLC. It explains how and why we use your personal data and applies to the personal data that you provide us directly, or which we may obtain from other sources. We may use your personal data for any of the purposes described in this Notice, or as otherwise stated at the point of collection.</p>

        <p>References to &ldquo;our&rdquo;, &ldquo;us&rdquo; or &ldquo;we&rdquo; within this Notice are to Al Sa&rsquo;ada Street, Business Bay, PO Box 500272, Dubai, United Arab Emirates, <a href="mailto:privacyoffice@dham.ae">privacyoffice@dham.ae</a>.</p>

        </div>

        </details>

        <details id="who-we-are" class="LegalContentPage__accordion">

        <summary class="LegalContentPage__accordion-summary"><span>Who we are</span>

        </summary>

        <div class="LegalContentPage__accordion-body">

        <p>We are the data controller of your personal data. We decide how and why your personal data is processed, either alone or jointly with others.</p>

        <p>If you visit our facilities and services, the entity which manages the relevant venue, facility or service will also be a data controller in respect of your personal information. You can access a &lsquo;Data Controller List&rsquo; here, which sets out all of our different entities and their contact details. This will enable you to identify the relevant entity that holds, processes, and secures your personal data and is the data controller in relation to your personal data.</p>

        </div>

        </details>

        <details id="information-covered-by-this-notice" class="LegalContentPage__accordion">

        <summary class="LegalContentPage__accordion-summary"><span>Information covered by this Notice</span>

        </summary>

        <div class="LegalContentPage__accordion-body">

        <p>In this Notice we refer to &ldquo;processing&rdquo; your &ldquo;personal data&rdquo;.</p>

        <p>Processing is taken to mean anything that is done to or with personal data (including simply collecting, storing or deleting that data).</p>

        <p>Personal data is any information relating to an identified or identifiable living person (for example, name, address, telephone number). When &ldquo;you&rdquo; or &ldquo;your&rdquo; are used in this Notice, we are referring to the relevant individual who is the subject of the personal data. Relevant individuals may include Primary Customers, Secondary Customers, and Children (as defined below).</p>

        <p><strong>Primary Customer:</strong> The individual or entity directly engaging with our services, facilities or products.</p>

        <p><strong>Secondary Customer:</strong> The individuals associated with the Primary Customer who benefit from or are involved in the service.</p>

        <p><strong>Sensitive Data:</strong> Includes data that reveals racial or ethnic origin, political opinions, religious and philosophical beliefs, trade union membership, genetic data, biometric data for uniquely identifying a natural person, and data concerning health.</p>

        </div>

        </details>

        <details id="our-use-of-cookies" class="LegalContentPage__accordion">

        <summary class="LegalContentPage__accordion-summary"><span>Our use of cookies</span>

        </summary>

        <div class="LegalContentPage__accordion-body">

        <p>Where we may use cookies, you can also control the data stored by cookies and withdraw consent to cookies by using the browser-based cookie controls described in our Cookie Policy available on our websites.</p>

        </div>

        </details>

        <details id="what-personal-data-do-we-collect-from-you-and-how-do-we-use-it" class="LegalContentPage__accordion">

        <summary class="LegalContentPage__accordion-summary"><span>What personal data do we collect from you and how do we use it?</span>

        </summary>

        <div class="LegalContentPage__accordion-body">

        <p>To provide services to you, we may process different categories of personal data whilst adhering to the data minimization and purpose limitation principles in accordance with the applicable data protection law. As described below:</p>

        <p><strong>Contact Details:</strong> Includes, but is not limited to, home address, home/personal mobile number, personal email address, and emergency contact number.</p>

        <p><strong>Identification Data:</strong> Includes, but is not limited to, name, title, company, individual physical description, photo, citizenship, nationality, passport data, visa information, driver&rsquo;s license information, resident country&rsquo;s ID, marriage certificate, birth certificate, education certificates, national/social insurance number (if applicable), health insurance, government retirement plan information, and tax reference/ID (if applicable).</p>

        <p><strong>Sensitive Data:</strong> Includes data that reveals racial or ethnic origin, political opinions, religious and philosophical beliefs, trade union membership, genetic data, biometric data for uniquely identifying a natural person, and data concerning health.</p>

        <p><strong>Web Data:</strong> Includes, but is not limited to, cookies, user activity logs, IP address, social media profile, and website visitor interaction data.</p>

        <p><strong>Financial Data:</strong> Includes, but is not limited to, card details and bank details.</p>

        <p><strong>Other Personal Data:</strong> Includes, but is not limited to, date of birth, age, gender, voice recording, religion, languages spoken, place of birth, marital status, country of residence, family, signature and driving license number.</p>

        <p>The reason these categories of personal data are processed, along with our lawful basis for doing so, are set out in the table below:</p>


