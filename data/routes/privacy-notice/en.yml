        <p><strong>CCTV:</strong> We operate CCTV systems across our premises to maintain the safety and security of our customers, employees, and property. The use of CCTV is based on our legitimate interest in preventing and addressing security incidents. Any personal data captured through CCTV is processed in accordance with applicable data protection laws and retained only for as long as necessary to fulfil these purposes. Signage indicating CCTV operation is displayed where required by law.</p>

        </div>

        </details>

        <details id="personal-data-indirectly-obtained-from-others" class="LegalContentPage__accordion">

        <summary class="LegalContentPage__accordion-summary"><span>Personal Data Indirectly Obtained from Others</span>

        </summary>

        <div class="LegalContentPage__accordion-body">

        <p>We may also receive some information about you from third parties. These are further detailed below:</p>

        <p><strong>Medical Service Providers:</strong> Where necessary, we obtain your personal data from medical service providers when accidents and incidents occur, and to ensure the provision of appropriate medical care when required.</p>

        <p><strong>Financial Service Providers:</strong> Where necessary, we obtain your personal data from financial service providers to verify membership information and to facilitate the performance of contracts or delivery of services.</p>

        <p><strong>Social Media Platforms:</strong> Where necessary, we obtain your personal data from social media platforms for analytics purposes, to manage and progress complaints, for marketing purposes, to improve our services and to carry out surveys.</p>

        <p>To the extent necessary, we will also receive your personal data from other entities within the Dubai Residential LLC group of companies, including our subsidiaries and holding companies.</p>

        </div>

        </details>

        <details id="legitimate-interest" class="LegalContentPage__accordion">

        <summary class="LegalContentPage__accordion-summary"><span>Legitimate Interest</span>

        </summary>

        <div class="LegalContentPage__accordion-body">

        <p>Where we rely upon legitimate interest as a lawful basis for processing, we assess and balance our interest, or those of relevant third parties, against your rights and freedoms to ensure they are not adversely affected. Legitimate Interest is where your personal data is processed for either our own interests or the interests of third parties. This can include commercial interests, individual interests, or broader societal benefits.</p>

        </div>

        </details>

        <details id="how-long-do-we-keep-your-personal-data" class="LegalContentPage__accordion">

        <summary class="LegalContentPage__accordion-summary"><span>How long do we keep your personal data?</span>

        </summary>

        <div class="LegalContentPage__accordion-body">

        <p>Your personal data will not be kept longer than necessary to meet the purposes detailed above. The criteria that we use to determine how long we will keep your personal data includes the period of time during which we have an ongoing relationship with you, and whether we have a legal obligation to store it (for example, for accounting purposes or for litigation, or regulatory investigations purposes), and our operational requirements. For details on storage periods, please refer to the section titled &ldquo;What personal data do we collect from you and how do we use it?&rdquo; earlier in this Notice.</p>

        <p>When your personal data is no longer required for the purposes described, we will securely remove it from our systems and records and/or take steps to properly anonymise it so that you can no longer be identified. However, we may retain your information to comply with legal or regulatory obligations to which we are subject.</p>

        </div>

        </details>

        <details id="who-do-we-share-your-personal-data-with" class="LegalContentPage__accordion">

        <summary class="LegalContentPage__accordion-summary"><span>Who do we share your personal data with?</span>

        </summary>

        <div class="LegalContentPage__accordion-body">

        <p>Where necessary to fulfil the purposes described in this Notice, we shall disclose your personal data to certain third-parties, vendors and service providers or affiliated employees, contractors and entities as described below. To the extent necessary, and where we have a lawful basis to do so, we will also share your personal data with other entities within Dubai Residential LLC group including our subsidiaries and holding companies. Where we share personal data, we do so with the following parties for the purposes set out below.</p>

        <div class="LegalContentPage__table-wrap">

        <table class="LegalContentPage__table">

        <thead>

        <tr>

        <th>Category of Third-Party</th>

        <th>Purpose for Disclosure</th>

        </tr>

        </thead>

        <tbody>

        <tr>

        <td>Legal and Professional Advisers</td>

        <td>Audits, Invoicing, Legal Requirements, Transaction processing, Accident and Incidents, comply with legal requirements and exercise or defend legal claims, Competition and events and IT security.</td>

        </tr>

        <tr>

        <td>Health Providers</td>

        <td>Accident and Incidents, comply with legal requirements and exercise or defend legal claims and Medical care</td>

        </tr>

        <tr>

        <td>Finance, Insurance and Credit Providers</td>

        <td>Invoicing, Payment Processing, Insurance, Valuation</td>

        </tr>

        <tr>

        <td>Government Bodies, Regulators</td>

        <td>Audits, Customer Queries, Invoicing, Legal Requirements, Improving our Service, Progress the Transaction</td>

        </tr>

        <tr>

        <td>IT, Digital, Technology and Telecoms</td>

        <td>Audits, Customer Queries, Application Security and Support, Improving our Service, Analytics, Marketing and Memberships</td>

        </tr>

        <tr>

        <td>Marketing and Research Services</td>

        <td>Providing services and Marketing</td>

        </tr>

        <tr>

        <td>Education and Childcare Providers</td>

        <td>Providing services and IT security, Education Providers and Improving our Service</td>

        </tr>

        <tr>

        <td>Membership Associations</td>

        <td>IT security, Marketing and Memberships</td>

        </tr>

        </tbody>

        </table>

        </div>

        </div>

        </details>

        <details id="profiling" class="LegalContentPage__accordion">

        <summary class="LegalContentPage__accordion-summary"><span>Profiling</span>

        </summary>

        <div class="LegalContentPage__accordion-body">

        <p>Where we have a lawful basis to do so, we will use your personal data to evaluate certain personal aspects about you, such as to analyse or predict aspects concerning your economic situation, personal preferences, interests, reliability, behaviour, location, or movements. This is known as &ldquo;Profiling&rdquo;. We undertake Profiling, which can involve the use of artificial intelligence, to tailor our services and marketing efforts, or to improve our offerings. By using Profiling, you or individuals with similar profile characteristics as you, may receive a more personalised experience with us or offers from us. You have the right to object to Profiling where we have used it to conduct direct marketing or where it is based on our legitimate interests. Please see section on &ldquo;Your rights&rdquo; for further information.</p>

        </div>

        </details>

        <details id="where-we-store-transfer-your-personal-data" class="LegalContentPage__accordion">

        <summary class="LegalContentPage__accordion-summary"><span>Where we store/transfer your personal data?</span>

        </summary>

        <div class="LegalContentPage__accordion-body">

        <p>When processing your personal data, we may transfer this to third parties based in other countries, to the extent necessary to fulfil the purposes described in this Notice. Your personal data may be transferred within the Dubai Residential LLC group including our subsidiaries and holding companies. Such transfers shall always be done in compliance with relevant data protection laws. Most personal data processed by us is stored in the United Arab Emirates, where the appropriate data protection measures are in place.</p>

        <p>Further information about transfers can be obtained by contacting us using the following email address <a href="mailto:privacyoffice@dham.ae">privacyoffice@dham.ae</a>.</p>

        <p>To the extent required, we will also transfer your personal data to third parties in connection with a reorganization, restructuring, merger, acquisition, or transfer of assets, provided that the receiving party agrees to treat your personal data in a manner consistent with applicable laws and requirements.</p>

        </div>

        </details>

        <details id="security-of-your-personal-data" class="LegalContentPage__accordion">

        <summary class="LegalContentPage__accordion-summary"><span>Security of your personal data</span>

        </summary>

        <div class="LegalContentPage__accordion-body">

        <p>We have implemented technology and operational security measures in order to protect personal data from loss, misuse, alteration, or destruction. Only authorised persons are provided access to personal data; such individuals have agreed to maintain the confidentiality of this personal data.</p>

        </div>

        </details>

        <details id="your-rights" class="LegalContentPage__accordion">

        <summary class="LegalContentPage__accordion-summary"><span>Your rights</span>

        </summary>

        <div class="LegalContentPage__accordion-body">

        <p>You may have certain rights regarding your personal data. However, these rights can vary depending upon the country you are located. Such country&rsquo;s law will determine which rights apply and in what instances.</p>

        <p><strong>Right to withdraw consent</strong></p>

        <p>Where you have provided your consent to us, you will always have the right to withdraw this at any time. You can do this either by following the information given at the time you provided your consent, or by contacting us using the following email address <a href="mailto:privacyoffice@dham.ae">privacyoffice@dham.ae</a>. The withdrawal of consent will not affect any processing that was based on consent before its withdrawal.</p>

        <p><strong>Right to request correction of your personal data</strong></p>

        <p>You will always have the right to request that we correct and update any personal data that we process about you that is inaccurate or incomplete. You can do this by contacting us at <a href="mailto:privacyoffice@dham.ae">privacyoffice@dham.ae</a>.</p>

        <p><strong>Additional Data Protection Rights</strong></p>

        <p>Certain Data Protection Regulation also provide you with additional rights which may allow you to:</p>

        <ul>

        <li>upon request, be provided access to, or copies of, your personal data that we process;</li>

        <li>upon request, restrict the processing of your personal data;</li>

        <li>upon request, delete your personal data which we process;</li>

        <li>object to our processing of your personal data; or</li>

        <li>upon request, obtain a copy of your personal data which we process in a commonly used and machine-readable format.</li>

        <li>lodge a complaint with the supervisory authority in your country of residence, place of work or the country in which an alleged infringement of data protection law has occurred</li>

        </ul>

        <p>It is important to understand that these rights are not absolute (e.g. their application may depend upon the lawful basis we rely upon to process your personal data) and that we may require further information from you (e.g. to confirm your identity) to action your request. You can enquire whether these rights apply to you by contacting us using the following email address at <a href="mailto:privacyoffice@dham.ae">privacyoffice@dham.ae</a>.</p>

        </div>

        </details>

        <details id="ai-implications" class="LegalContentPage__accordion">

        <summary class="LegalContentPage__accordion-summary"><span>AI Implications</span>

        </summary>

        <div class="LegalContentPage__accordion-body">

        <p><strong>Artificial Intelligence (AI) Systems:</strong> We use AI Systems that process personal data to enable us to improve our services and user experiences. We remain vigilant when using AI to protect personal data, ensuring customer privacy, and preventing unauthorised or fraudulent activity. Our customers and stakeholders shall remain confident that personal data is adequately protected with us, especially in cases where AI is used to deliver the product or service, as this may infer heightened protection where AI is deployed.</p>

        <p><strong>How we use AI Systems</strong></p>

        <p>This notice gives you information on how we protect your personal data in our use of the AI System.</p>

        <p>Personal data may be processed within our AI Systems. We remain the data controller for your personal data when it is processed while using our AI Systems. We process personal data in accordance with the relevant data protection laws. In the case where we have engaged a processor, we have mandated contracts that uphold our standards in compliance with the relevant data protection laws.</p>

        <p>We will sometimes process customers&rsquo; personal data when using AI Systems. We have regulated the use of AI internally, weighed the opportunities and risks in advance of our use of AI and ensured appropriate human supervision where important matters are concerned. Where we offer dialogues with an AI, we will make this evident and, if necessary, point out potential errors.</p>

        <p><strong>Personal Data Processed by AI Systems</strong></p>

        <p>We may collect personal data either directly from you, third parties or public sources. We process your personal data using AI Systems to improve the efficiency, quality, and speed of our business processes and for the purpose of providing services. When using AI systems, we may process various types of personal data. For more information, please refer to the section titled &ldquo;What personal data do we collect from you and how do we use it?&rdquo;.</p>

        <p>In limited circumstances, we may process sensitive data through the AI System, but we will ensure that we have the necessary lawful basis in place before doing so. Where we process your existing personal data, we will continue to rely on the appropriate lawful basis for that processing activity. In certain instances, we engage data processors; however, they are unable to access any of your personal data entered in the AI Systems. We have mandated contracts with data processors to ensure that your personal data is protected.</p>

        </div>

        </details>

        <details id="contact-us" class="LegalContentPage__accordion">

        <summary class="LegalContentPage__accordion-summary"><span>Contact us</span>

        </summary>

        <div class="LegalContentPage__accordion-body">

        <p>If you want to exercise any of the rights set out above or have any questions or concerns about how we treat your personal data, please contact us at <a href="mailto:privacyoffice@dham.ae">privacyoffice@dham.ae</a> or by writing to us at: Dubai Residential LLC, Al Sa&rsquo;ada Street, Business Bay, PO Box 500272, Dubai, United Arab Emirates. Please include your reply address when you write to us.</p>

        </div>

        </details>

        <details id="changes-to-this-notice" class="LegalContentPage__accordion">

        <summary class="LegalContentPage__accordion-summary"><span>Changes to this Notice</span>

        </summary>

        <div class="LegalContentPage__accordion-body">

        <p>We keep this Notice under regular review. We reserve the right, at our discretion, to change, modify, add or remove sections of this Notice at any time. You are also encouraged to review this Notice from time to time for updates. We will notify you of any changes (including when they will take effect) if we are required to do so by data protection laws.</p>

        </div>

        </details>

