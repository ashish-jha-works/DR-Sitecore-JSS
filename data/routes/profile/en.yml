        dependentsDetailsBody: |
          <p>Manage family member information connected with your tenancy profile.</p>
        addDependentInfoText: |
          <p>When adding a dependent, ensure all details are entered accurately. If any changes are required later, the dependent must be deleted and re-added with the correct information.</p>
        dependentSubProfileHelpText: |
          <p>Dependents with sub profiles will be able to log in and manage their own account, and will have permission to raise maintenance requests and view events.</p>
        dependentSubProfilePermissionsBanner: |
          <p>Your dependent will be granted access to event updates by default and will be able to raise maintenance requests.</p>
        dependentSubProfileMaintenanceText: |
          <p>Your dependent will be able to raise new maintenance requests in the services section.</p>
        dependentSubProfileEventsText: |
          <p>Your dependent will have the ability to view the events taking place in the community, indicate if they would be attending, and receive community updates.</p>
        dependentSubProfileAcknowledgementText: |
          <p>I acknowledge that I am creating this subprofile with the specified permissions</p>
